# buildspec.yml — AWS CodeBuild specification for SST deployments
#
# This file is used by the CodePipeline construct (Pipeline.ts).
# It runs inside an Amazon Linux 2023 container with Node.js pre-installed.
#
# Environment variables injected by CodeBuild:
#   SST_STAGE     — The SST stage to deploy (e.g., "production", "dev")
#   NODE_VERSION  — Node.js version to install (default: "22")
#   PNPM_VERSION  — pnpm version to install (default: "9.15.0")
#   INFRA_PATH    — Path to the infra package (default: "packages/infra")

version: 0.2

env:
  variables:
    SST_STAGE: "dev"
    NODE_VERSION: "22"
    PNPM_VERSION: "9.15.0"
    INFRA_PATH: "packages/infra"
    # Domain configuration — set to your root domain
    DOMAIN_ROOT: "example.com"
    # Project prefix for pipeline/resource naming
    PROJECT_PREFIX: "myapp"
    # Lambda function prefix for orphan cleanup
    PREFIX: "myapp"
    # Optional stage-domain overrides used by DNS helper scripts
    DOMAIN_PRODUCTION: "example.com"
    DOMAIN_DEV: "dev.example.com"
    DOMAIN_MOBILE: "mobile.example.com"
    # Pipeline safety defaults (do not mutate CI/CD on normal deploys)
    INFRA_CREATE_PIPELINES: "false"
    INFRA_PIPELINE_PERMISSIONS_MODE: "admin"
    INFRA_PIPELINES_CONFIG_PATH: "config/pipelines.json"
    # Polling for CloudFront distribution deployment (seconds)
    POLL_TIMEOUT: "600"
    POLL_INTERVAL: "15"
    # Optionally skip the Route53 DNS check if DNS is managed externally
    SKIP_DNS_CHECK: "false"
    # Automatically remove conflicting A/CNAME/ALIAS records before deploy
    AUTO_REMOVE_CONFLICTING_DNS: "true"

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      # Ensure exact Node version required by repo (package.json engines)
      - echo "Checking for 'n' (node version manager)"
      - if command -v n >/dev/null 2>&1; then echo "'n' already installed"; else echo "Installing 'n'"; npm install -g n || npm install -g n --force; fi
      - echo "Switching Node to 22.22.0"
      - n 22.22.0
      - node --version

      # Enable pnpm via corepack (built into Node.js, avoids PATH issues)
      - corepack enable pnpm
      - corepack prepare pnpm@${PNPM_VERSION} --activate
      - pnpm --version

      # Configure pnpm store for caching
      - pnpm config set store-dir /root/.pnpm-store

      # Install all workspace dependencies (frozen lockfile for reproducibility)
      - pnpm install --frozen-lockfile

  pre_build:
    commands:
      - echo "Stage    = ${SST_STAGE}"
      - echo "Node     = $(node --version)"
      - echo "pnpm     = $(pnpm --version)"
      - echo "Infra    = ${INFRA_PATH}"
      - echo "Running infra doctor..."
      - |
        if [ -f "${INFRA_PATH}/dist/bin/init.js" ]; then
          node "${INFRA_PATH}/dist/bin/init.js" doctor --target "${INFRA_PATH}" || (echo "infra doctor failed" && exit 1)
        elif [ -f "${INFRA_PATH}/bin/init.ts" ]; then
          echo "Building local infra CLI for doctor..."
          (cd "${INFRA_PATH}" && pnpm run build)
          node "${INFRA_PATH}/dist/bin/init.js" doctor --target "${INFRA_PATH}" || (echo "infra doctor failed" && exit 1)
        elif [ -f "./node_modules/@lsts_tech/infra/dist/bin/init.js" ]; then
          node "./node_modules/@lsts_tech/infra/dist/bin/init.js" doctor --target "${INFRA_PATH}" || (echo "infra doctor failed" && exit 1)
        else
          echo "Could not locate an infra doctor binary." && exit 1
        fi
      - echo "Running pre-deploy checks..."
      - |
        if [ -f "${INFRA_PATH}/scripts/predeploy-checks.sh" ]; then
          chmod +x "${INFRA_PATH}/scripts/predeploy-checks.sh" || true
          "${INFRA_PATH}/scripts/predeploy-checks.sh" ${SST_STAGE}
        elif [ -f "./scripts/predeploy-checks.sh" ]; then
          chmod +x "./scripts/predeploy-checks.sh" || true
          ./scripts/predeploy-checks.sh ${SST_STAGE}
        else
          echo "No predeploy checks script found at ${INFRA_PATH}/scripts/predeploy-checks.sh or ./scripts/predeploy-checks.sh"
        fi

  build:
    commands:
      # Deploy using SST from the infra package directory
      - cd ${INFRA_PATH}
      - npx sst deploy --stage ${SST_STAGE}

  post_build:
    commands:
      - |
        if [ "${CODEBUILD_BUILD_SUCCEEDING:-0}" != "1" ]; then
          echo "Build failed; skipping post-deploy DNS sync."
          exit 0
        fi
      - echo "✅ SST deploy completed for stage ${SST_STAGE}"
      - echo "Running post-deploy DNS sync"
      - |
        if [ -f "${INFRA_PATH}/scripts/postdeploy-update-dns.sh" ]; then
          chmod +x "${INFRA_PATH}/scripts/postdeploy-update-dns.sh" || true
          "${INFRA_PATH}/scripts/postdeploy-update-dns.sh" ${SST_STAGE} || echo "post-deploy DNS sync failed"
        elif [ -f "./scripts/postdeploy-update-dns.sh" ]; then
          chmod +x "./scripts/postdeploy-update-dns.sh" || true
          ./scripts/postdeploy-update-dns.sh ${SST_STAGE} || echo "post-deploy DNS sync failed"
        else
          echo "No post-deploy DNS sync script found; skipping"
        fi

cache:
  paths:
    # Cache pnpm store between builds for faster installs
    - /root/.pnpm-store/**/*
    # Cache SST state
    - packages/infra/.sst/**/*
